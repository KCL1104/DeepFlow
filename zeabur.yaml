apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: DeepFlow
spec:
  description: DeepFlow - AI-powered attention guardian that protects your focus.
  tags:
    - AI
    - Productivity
    - Tool
  variables:
    # Backend & Agent Shared
    - key: REDIS_URL
      type: STRING
      name: Redis URL
      description: Redis connection URL (e.g., redis://:password@host:port).
    
    # Supabase (Backend)
    - key: SUPABASE_URL
      type: STRING
      name: Supabase URL
      description: Your Supabase Project URL.
    - key: SUPABASE_KEY
      type: PASSWORD
      name: Supabase Anon Key
      description: Your Supabase Anonymous Key.
    - key: SUPABASE_SERVICE_ROLE_KEY
      type: PASSWORD
      name: Supabase Service Role Key
      description: Your Supabase Service Role Key.

    # AI & Agent (Agent)
    - key: OPENAI_API_KEY
      type: PASSWORD
      name: OpenAI API Key
      description: API Key for OpenAI.
    - key: OPENAI_API_BASE
      type: STRING
      name: OpenAI API Base
      description: Base URL for OpenAI API (optional).
    - key: LLM_MODEL
      type: STRING
      name: LLM Model
      description: Model name to use (e.g., gpt-4o).
    
    # Opik (Agent)
    - key: OPIK_API_KEY
      type: PASSWORD
      name: Opik API Key
      description: API Key for Opik.
    - key: OPIK_PROJECT_NAME
      type: STRING
      name: Opik Project Name
      description: Opik Project Name.
    - key: OPIK_WORKSPACE
      type: STRING
      name: Opik Workspace
      description: Opik Workspace.
    
    # Telegram (Agent)
    - key: TELEGRAM_BOT_TOKEN
      type: PASSWORD
      name: Telegram Bot Token
      description: Token for your Telegram Bot.
    - key: SLACK_BOT_TOKEN
      type: PASSWORD
      name: Slack Bot Token
      description: Token for your Slack Bot.
    
    # Domains
    - key: BACKEND_DOMAIN
      type: DOMAIN
      name: Backend Domain
      description: The domain to assign to the Backend API.
    - key: FRONTEND_DOMAIN
      type: DOMAIN
      name: Frontend Domain
      description: The domain to assign to the Frontend App.

  services:
    - name: Backend
      template: GIT
      domainKey: BACKEND_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1136691264
          branch: main
          rootDirectory: backend
        ports:
          - id: http
            port: 8000
            type: HTTP
        env:
          REDIS_URL:
            default: ${REDIS_URL}
          SUPABASE_URL:
            default: ${SUPABASE_URL}
          SUPABASE_ANON_KEY:
            default: ${SUPABASE_KEY}
          SUPABASE_SERVICE_ROLE_KEY:
            default: ${SUPABASE_SERVICE_ROLE_KEY}

    - name: Agent
      template: GIT
      spec:
        source:
          source: GITHUB
          repo: 1136691264
          branch: main
          rootDirectory: agent
        env:
          REDIS_URL:
            default: ${REDIS_URL}
          OPENAI_API_KEY:
            default: ${OPENAI_API_KEY}
          OPENAI_API_BASE:
            default: ${OPENAI_API_BASE}
          LLM_MODEL:
            default: ${LLM_MODEL}
          OPIK_API_KEY:
            default: ${OPIK_API_KEY}
          OPIK_PROJECT_NAME:
            default: ${OPIK_PROJECT_NAME}
          OPIK_WORKSPACE:
            default: ${OPIK_WORKSPACE}
          TELEGRAM_BOT_TOKEN:
            default: ${TELEGRAM_BOT_TOKEN}
          SLACK_BOT_TOKEN:
            default: ${SLACK_BOT_TOKEN}
          BACKEND_URL:
            default: https://${BACKEND_DOMAIN}
          SUPABASE_URL:
            default: ${SUPABASE_URL}
          SUPABASE_SERVICE_ROLE_KEY:
            default: ${SUPABASE_SERVICE_ROLE_KEY}

    - name: Frontend
      template: GIT
      domainKey: FRONTEND_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1136691264
          branch: main
          rootDirectory: frontend
        ports:
          - id: http
            port: 3000
            type: HTTP
        env:
          NEXT_PUBLIC_API_URL:
            default: https://${BACKEND_DOMAIN}/api/v1
          NEXT_PUBLIC_SUPABASE_URL:
            default: ${SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY:
            default: ${SUPABASE_KEY}
          NEXT_PUBLIC_SITE_URL:
            default: https://${FRONTEND_DOMAIN}
