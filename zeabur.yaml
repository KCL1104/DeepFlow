apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: DeepFlow
spec:
  description: DeepFlow - AI-powered attention guardian for focus protection.
  tags:
    - AI
    - Productivity
    - Automation

  variables:
    - key: REDIS_URL
      type: STRING
      name: Redis URL
      description: Redis connection URL (redis://:password@host:port).

    - key: SUPABASE_URL
      type: STRING
      name: Supabase URL
      description: Your Supabase project URL.
    - key: SUPABASE_ANON_KEY
      type: PASSWORD
      name: Supabase Anon Key
      description: Supabase anonymous key.
    - key: SUPABASE_SERVICE_ROLE_KEY
      type: PASSWORD
      name: Supabase Service Role Key
      description: Supabase service role key.

    - key: OPENAI_API_KEY
      type: PASSWORD
      name: OpenAI API Key
      description: API key for OpenAI-compatible model provider.
    - key: OPENAI_API_BASE
      type: STRING
      name: OpenAI API Base
      description: Optional OpenAI-compatible API base URL.
    - key: LLM_MODEL
      type: STRING
      name: LLM Model
      description: Model name used by the agent (for example gpt-4o).

    - key: OPIK_API_KEY
      type: PASSWORD
      name: Opik API Key
      description: API key for Opik tracing.
    - key: OPIK_PROJECT_NAME
      type: STRING
      name: Opik Project
      description: Opik project name.
    - key: OPIK_WORKSPACE
      type: STRING
      name: Opik Workspace
      description: Opik workspace name.

    - key: TELEGRAM_BOT_TOKEN
      type: PASSWORD
      name: Telegram Bot Token
      description: Telegram bot token for DeepFlow bot.
    - key: SLACK_BOT_TOKEN
      type: PASSWORD
      name: Slack Bot Token
      description: Slack bot token.

    - key: BACKEND_DOMAIN
      type: DOMAIN
      name: Backend Domain
      description: Public domain for backend API.
    - key: FRONTEND_DOMAIN
      type: DOMAIN
      name: Frontend Domain
      description: Public domain for frontend app.

  services:
    - name: Backend
      template: GIT
      domainKey: BACKEND_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1136691264
          branch: main
          rootDirectory: backend
        ports:
          - id: http
            port: 8000
            type: HTTP
        env:
          APP_ENV:
            default: production
          REDIS_URL:
            default: ${REDIS_URL}
          SUPABASE_URL:
            default: ${SUPABASE_URL}
          SUPABASE_ANON_KEY:
            default: ${SUPABASE_ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY:
            default: ${SUPABASE_SERVICE_ROLE_KEY}
          CORS_ORIGINS:
            default: https://${FRONTEND_DOMAIN}
          PORT:
            default: "8000"

    - name: Agent
      template: GIT
      spec:
        source:
          source: GITHUB
          repo: 1136691264
          branch: main
          rootDirectory: agent
        env:
          AGENT_MODE:
            default: worker
          REDIS_URL:
            default: ${REDIS_URL}
          OPENAI_API_KEY:
            default: ${OPENAI_API_KEY}
          OPENAI_API_BASE:
            default: ${OPENAI_API_BASE}
          LLM_MODEL:
            default: ${LLM_MODEL}
          OPIK_API_KEY:
            default: ${OPIK_API_KEY}
          OPIK_PROJECT_NAME:
            default: ${OPIK_PROJECT_NAME}
          OPIK_WORKSPACE:
            default: ${OPIK_WORKSPACE}
          TELEGRAM_BOT_TOKEN:
            default: ${TELEGRAM_BOT_TOKEN}
          SLACK_BOT_TOKEN:
            default: ${SLACK_BOT_TOKEN}
          BACKEND_URL:
            default: https://${BACKEND_DOMAIN}
          SUPABASE_URL:
            default: ${SUPABASE_URL}
          SUPABASE_SERVICE_ROLE_KEY:
            default: ${SUPABASE_SERVICE_ROLE_KEY}

    - name: Frontend
      template: GIT
      domainKey: FRONTEND_DOMAIN
      spec:
        source:
          source: GITHUB
          repo: 1136691264
          branch: main
          rootDirectory: frontend
        ports:
          - id: http
            port: 3000
            type: HTTP
        env:
          NODE_ENV:
            default: production
          PORT:
            default: "3000"
          NEXT_PUBLIC_API_URL:
            default: https://${BACKEND_DOMAIN}/api/v1
          NEXT_PUBLIC_SUPABASE_URL:
            default: ${SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY:
            default: ${SUPABASE_ANON_KEY}
          NEXT_PUBLIC_SITE_URL:
            default: https://${FRONTEND_DOMAIN}
